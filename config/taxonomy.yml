# 全局配置
global:
  # arXiv 检索的 categories
  arxiv_categories:
    - "cs.CV"
    - "cs.AI"
    - "cs.CL"

  # 抓取频率
  fetch_interval_days: 1

  # 去重策略：基于 arXiv ID
  dedup_by: "arxiv_id"

  # 最低分数阈值（低于此分数的论文不会被收录）
  min_score: 6

  # GitHub 搜索限流保护
  github_rate_limit: 30

  # 需要排除的关键词（出现则过滤）
  blocklist_keywords:
    - "medical imaging anomaly"
    - "network anomaly"
    - "intrusion detection"
    - "industrial defect"
    - "manufacturing anomaly"

  # 种子论文（手动确认的经典论文）
  seed_papers:
    - id: "1903.04648"
      title: "PatchELH: Density Estimation for Anomaly Detection"
    - id: "2106.10897"
      title: "ABNet: Learning Absence of Evidence for Anomaly Detection"
    - id: "2006.04737"
      title: "SFA-Net: Spatial-Frequency Awareness for Anomaly Detection"
