        - "anomaly grounding"
    classics: []

  - id: video-anomaly-understanding
    name: "视频异常理解"
    emoji: "🧠"
    doc: "docs/video-anomaly-understanding.md"
    description: "使用大视觉语言模型进行异常检测和解释"
