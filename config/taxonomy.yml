  # ========== 综述与基准 ==========
  - id: vad-surveys
    name: "综述论文"
    emoji: "📚"
    doc: "docs/surveys.md"
    description: "Video Anomaly Detection 领域的综述、调研论文"
    arxiv_queries:
      - 'video anomaly detection survey review'
    github_queries: []
    keywords:
      strong:
        - "video anomaly detection survey"
        - "video anomaly detection review"
        - "video anomaly detection comprehensive"
        - "video anomaly detection progress"
      medium:
