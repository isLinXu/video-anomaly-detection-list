# Video Anomaly Detection Taxonomy
# 用于自动抓取和分类论文的配置

categories:
  # ========== 主要监督设定 ==========
  - id: weakly-supervised-vad
    name: "弱监督 VAD"
    emoji: "👁️"
    doc: "docs/weakly-supervised-vad.md"
    description: "仅使用视频级标签进行训练，检测帧级或区域级异常"
    arxiv_queries:
      - 'video anomaly detection weakly supervised'
    github_queries:
      - '"weakly supervised" "anomaly detection" video'
    keywords:
      strong:
        - "weakly supervised anomaly"
        - "weakly-supervised anomaly"
        - "weakly supervised video anomaly"
        - "wsvad"
      medium:
        - "multiple instance learning anomaly"
        - "mil anomaly detection"
        - "video anomaly weakly supervised"
      weak:
        - "anomaly detection video"
        - "video anomaly"
    classics:
      - id: "2106.10897"
        expect: "abnet"
        note: "ABNet: Learning Absence of Evidence for Anomaly Detection"
      - id: "2006.04737"
        expect: "sfa-net"
        note: "SFA-Net: Spatial-Frequency Awareness"

  - id: semi-supervised-vad
    name: "半监督 VAD"
    emoji: "🔍"
    doc: "docs/semi-supervised-vad.md"
    description: "仅使用正常视频训练，检测异常事件"
    arxiv_queries:
      - 'video anomaly detection semi-supervised'
    github_queries:
      - '"semi-supervised" "anomaly detection" video'
    keywords:
      strong:
        - "semi-supervised anomaly"
        - "semi-supervised video anomaly"
        - "normal video only"
        - "anomaly detection normal training"
        - "ssvad"
      medium:
        - "anomaly detection unsupervised"
        - "unsupervised video anomaly"
        - "reconstruction-based anomaly"
        - "feature distribution anomaly"
      weak:
        - "video anomaly detection"
        - "anomaly detection video"
    classics:
      - id: "1903.04648"
        expect: "patch-detect"
        note: "PatchELH: Density Estimation for Anomaly Detection"
      - id: "2003.01923"
        expect: "srav"
        note: "SRAV: Self-supervised Representation learning for Anomaly Video detection"

  - id: fully-supervised-vad
    name: "全监督 VAD"
    emoji: "📊"
    doc: "docs/fully-supervised-vad.md"
    description: "使用标注的异常和正常视频进行训练"
    arxiv_queries:
      - 'video anomaly detection supervised'
    github_queries:
      - '"fully supervised" "anomaly detection" video'
    keywords:
      strong:
        - "fully supervised anomaly"
        - "fully-supervised anomaly"
        - "supervised video anomaly"
      medium:
        - "anomaly classification video"
        - "video anomaly classification"
        - "temporal action anomaly"
      weak:
        - "video anomaly"
        - "anomaly detection"
    classics:
      - id: "2106.07708"
        expect: "tdap"
        note: "TDAP: Temporal Dependency Awareness"

  # ========== 新兴设定 ==========
  - id: open-world-vad
    name: "开放世界 VAD"
    emoji: "🌍"
    doc: "docs/open-world-vad.md"
    description: "检测和描述未见过的异常类型"
    arxiv_queries:
      - 'video anomaly detection open world'
      - 'video anomaly detection novel unknown'
    github_queries:
      - '"open world" "anomaly detection" video'
    keywords:
      strong:
        - "open-world anomaly"
        - "open world video anomaly"
        - "open-set anomaly"
        - "novel anomaly detection"
        - "unknown anomaly"
      medium:
        - "zero-shot anomaly detection"
        - "zero-shot video anomaly"
        - "unseen anomaly"
      weak:
        - "video anomaly description"
        - "anomaly description"
    classics:
      - id: "2306.04181"
        expect: "hawk"
        note: "HAWK: Learning to Understand Open-World Video Anomalies"

  - id: video-anomaly-retrieval
    name: "视频异常检索"
    emoji: "🔎"
    doc: "docs/video-anomaly-retrieval.md"
    description: "基于自然语言查询检索视频中的异常片段"
    arxiv_queries:
      - 'video anomaly retrieval'
      - 'video anomaly localization text'
    github_queries:
      - '"video anomaly retrieval" OR "anomaly retrieval"'
    keywords:
      strong:
        - "video anomaly retrieval"
        - "anomaly retrieval"
        - "video anomaly localization text"
        - "language-based anomaly"
        - "text-video anomaly"
      medium:
        - "cross-modal anomaly"
        - "multimodal anomaly retrieval"
        - "video anomaly search"
      weak:
