    description: "新的异常检测数据集和基准"
    arxiv_queries:
      - 'video anomaly benchmark dataset'
      - 'anomaly detection dataset benchmark'
    github_queries:
      - '"anomaly detection" dataset OR "anomaly benchmark"'
    keywords:
      strong:
